name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: string

jobs:
  deploy:
    name: SSH deploy CareTracker frontend
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 45

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 40m
          envs: DEPLOY_BRANCH
          script: |
            set -e
            BRANCH="${DEPLOY_BRANCH:-main}"
            echo "Deploying frontend branch: ${BRANCH}"
            cd /var/www/CareTracker-frontend/
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
            # Stop either legacy compose name or Actions image name
            docker stop caretracker-frontend caretracker-admin || true
            docker rm caretracker-frontend caretracker-admin || true
            docker rmi caretracker-frontend caretracker-admin:latest || true
            docker system prune -af
            docker build --no-cache \
              --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://caretraker.com/api/api}" \
              -t caretracker-frontend .
            docker run -d \
              --name caretracker-frontend \
              --restart unless-stopped \
              -p 5173:5173 \
              caretracker-frontend
