name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main
        type: string

jobs:
  deploy:
    name: SSH deploy CareTracker frontend
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 45

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 40m
          envs: DEPLOY_BRANCH,VITE_API_BASE_URL,VITE_STRIPE_PUBLISHABLE_KEY
          script: |
            set -e
            BRANCH="${DEPLOY_BRANCH:-main}"
            echo "Deploying frontend branch: ${BRANCH}"
            cd /var/www/CareTracker-frontend/
            git fetch origin "${BRANCH}"
            git reset --hard HEAD
            git clean -fd
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            node -e 'const fs=require("fs");const p=".env";const k="VITE_STRIPE_PUBLISHABLE_KEY";const v=String(process.env.VITE_STRIPE_PUBLISHABLE_KEY||"").trim();if(!v){console.log(k+" secret is empty");process.exit(0);}const text=fs.existsSync(p)?fs.readFileSync(p,"utf8"):"";const lines=text.split(/\r?\n/);let f=false;const out=lines.map((l)=>{if(l.startsWith(k+"=")){f=true;return k+"="+v;}return l;});if(!f){if(out.length&&out[out.length-1]!=="")out.push("");out.push(k+"="+v);}fs.writeFileSync(p,out.join("\n").replace(/\n+$/,"\n"));console.log(k+" synced into frontend .env");'
            # Stop either legacy compose name or Actions image name
            docker stop caretracker-frontend caretracker-admin || true
            docker rm caretracker-frontend caretracker-admin || true
            docker rmi caretracker-frontend caretracker-admin:latest || true
            docker system prune -af
            docker build --no-cache \
              --build-arg "VITE_API_BASE_URL=${VITE_API_BASE_URL:-}" \
              --build-arg "VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}" \
              -t caretracker-frontend .
            docker run -d \
              --name caretracker-frontend \
              --restart unless-stopped \
              -p 5173:5173 \
              caretracker-frontend
