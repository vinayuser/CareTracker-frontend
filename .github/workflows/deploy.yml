name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: SSH deploy CareTracker frontend
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 45

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy over SSH
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -e
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USERNAME" '
            set -e
            cd /var/www/CareTracker-frontend/
            git pull
            docker stop caretracker-frontend || true
            docker rm caretracker-frontend || true
            docker rmi caretracker-frontend || true
            docker system prune -af
            docker build --no-cache -t caretracker-frontend .
            docker run -d \
              --name caretracker-frontend \
              -p 5173:5173 \
              caretracker-frontend
          '
